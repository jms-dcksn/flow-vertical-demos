name: Deploy UiPath solution

on:
  workflow_call:
    inputs:
      solution_path: { required: true, type: string }
      package_name: { required: true, type: string }
      package_version: { required: true, type: string }
      deployment_name: { required: true, type: string }
      folder_name: { required: true, type: string }
      deployment_config: { required: true, type: string }

permissions:
  contents: read

jobs:
  deploy:
    if: vars.UIPATH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: playground-deploy
    env:
      UIPATH_CLIENT_ID: ${{ secrets.UIPATH_CLIENT_ID }}
      UIPATH_CLIENT_SECRET: ${{ secrets.UIPATH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @uipath/cli
      - name: Pack, publish, deploy, and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs package
          uip login --client-id env.UIPATH_CLIENT_ID --client-secret env.UIPATH_CLIENT_SECRET --tenant Playground --output json | tee logs/login.json
          uip solution resources refresh --solution-folder "${{ inputs.solution_path }}" --output json | tee logs/resources-refresh.json
          uip solution restore "${{ inputs.solution_path }}" --output json | tee logs/restore.json
          uip solution pack "${{ inputs.solution_path }}" package --name "${{ inputs.package_name }}" --version "${{ inputs.package_version }}" --output json | tee logs/pack.json
          package_path="package/${{ inputs.package_name }}.${{ inputs.package_version }}.zip"
          uip solution publish "$package_path" --output json | tee logs/publish.json
          uip solution deploy run --name "${{ inputs.deployment_name }}" --package-name "${{ inputs.package_name }}" --package-version "${{ inputs.package_version }}" --folder-name "${{ inputs.folder_name }}" --parent-folder-path JD_Demos/demos --config-file "${{ inputs.deployment_config }}" --output json | tee logs/deploy-run.json
          pipeline_id=$(jq -r '.Data.PipelineDeploymentId' logs/deploy-run.json)
          test "$pipeline_id" != null
          uip solution deploy status "$pipeline_id" --output json | tee logs/deploy-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-package-${{ inputs.package_name }}-${{ inputs.package_version }}
          path: package/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-logs-${{ inputs.package_name }}-${{ inputs.package_version }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30
