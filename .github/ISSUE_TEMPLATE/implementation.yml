name: Implementation
description: Request work on a defined demo solution or shared repository capability.
title: "[Implementation]: "
labels:
  - "type: implementation"
body:
  - type: markdown
    attributes:
      value: |
        Use this form only when the intended outcome and acceptance criteria are concrete enough to build or change.
  - type: dropdown
    id: scope
    attributes:
      label: Domain or shared area
      options:
        - commercial-banking
        - consumer-banking
        - healthcare-payer
        - healthcare-provider
        - life-insurance
        - medtech
        - p-c-insurance
        - pharma
        - retail
        - reference-solution
        - repository-wide
    validations:
      required: true
  - type: input
    id: solution_scope
    attributes:
      label: Solution scope
      description: Name the solution or shared capability to change.
      placeholder: commercial-banking/payment-exception
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: State the user-visible outcome, artifact changes, and validation expected for this work.
      placeholder: |
        - The Flow or repository artifact is updated.
        - The defined validation command succeeds.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List each dependency as `blocked-by #<issue>`, or write `None`.
      placeholder: None
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Readiness state
      description: Select the state that should apply after triage confirms the issue is complete.
      options:
        - ready for agent
        - ready for human
    validations:
      required: true
